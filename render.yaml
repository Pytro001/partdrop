# Render Blueprint: API (Node web service) + web app (static site that rewrites API paths).
# Not deployed yet. In Render: New > Blueprint > pick this repo, then fill the sync:false values.
services:
  - type: web
    name: partdrop-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PAYPAL_MODE
        value: mock            # set to sandbox once PAYPAL_CLIENT_ID/SECRET/WEBHOOK_ID are filled
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: AWS_BEARER_TOKEN_BEDROCK
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: BEDROCK_CLAUDE_MODEL
        value: us.anthropic.claude-sonnet-4-5-20250929-v1:0
      - key: AI_MODE
        value: live
      - key: AUTH_SECRET
        generateValue: true
      - key: DEMO_PASSWORD
        value: partdrop
      - key: PUBLIC_API_URL
        value: https://partdrop-api.onrender.com
      - key: CORS_ORIGINS
        value: https://partdrop.onrender.com
      - key: DATA_DIR
        value: /tmp/partdrop   # demo data, reset on every deploy (free plan has no disk)

  - type: web
    name: partdrop
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: web/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://partdrop-api.onrender.com/api/*
      - type: rewrite
        source: /mock-paypal/*
        destination: https://partdrop-api.onrender.com/mock-paypal/*
      - type: rewrite
        source: /samples/*
        destination: https://partdrop-api.onrender.com/samples/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /occt/*
        name: Cache-Control
        value: public, max-age=86400
